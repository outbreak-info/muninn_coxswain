---
- name: Install dependencies
  hosts: all # todo
  remote_user: james_coxswain

  tasks:
    - name: Apt update
      become: true
      ansible.builtin.apt:
        update_cache: yes

    - name: Ensure git
      become: true
      ansible.builtin.apt:
        name: git
        state: present

    - name: Ensure unzip
      become: true
      ansible.builtin.apt:
        name: unzip
        state: present

    - name: Ensure docker
      become: true
      ansible.builtin.apt:
        name: docker
        state: present

    - name: Ensure docker-compose
      become: true
      ansible.builtin.apt:
        name: docker-compose
        state: present

- name: Get muninn sources
  hosts: all # todo 
  remote_user: james_coxswain
  vars:
    src_dir_name: "muninn-master"

  tasks:
    - name: Remove sources if present
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/{{ src_dir_name }}"
        state: absent

    - name: Download muninn
      ansible.builtin.unarchive:
        src: https://github.com/outbreak-info/muninn/archive/refs/heads/master.zip
        remote_src: yes
        dest: "{{ ansible_env.HOME }}"
