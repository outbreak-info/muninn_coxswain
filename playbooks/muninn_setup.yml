---
- name: Install dependencies
  hosts: all # todo
  remote_user: james_coxswain
  become: true

  tasks:
    - name: Apt update
      ansible.builtin.apt:
        update_cache: yes

    - name: Ensure git
      ansible.builtin.apt:
        name: git
        state: present

    - name: Ensure unzip
      ansible.builtin.apt:
        name: unzip
        state: present

    - name: Ensure docker
      ansible.builtin.apt:
        name: docker
        state: present

    - name: Ensure docker-compose
      ansible.builtin.apt:
        name: docker-compose
        state: present

    - name: Ensure nginx
      ansible.builtin.apt:
        name: nginx
        state: present

- name: Get muninn sources
  hosts: all # todo 
  remote_user: james_coxswain
  vars:
    src_dir_name: "muninn-master"

  tasks:
    - name: Remove sources if present
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/{{ src_dir_name }}"
        state: absent

    - name: Download muninn
      ansible.builtin.unarchive:
        src: https://github.com/outbreak-info/muninn/archive/refs/heads/master.zip
        remote_src: yes
        dest: "{{ ansible_env.HOME }}"

- name: Nginx setup
  hosts: all # todo
  become: yes

  tasks:
    - name: Copy nginx.conf
      ansible.builtin.copy:
        src: /runner/project/nginx.conf
        dest: /etc/nginx/nginx.conf

    - name: Copy api_proxy.conf
      ansible.builtin.copy:
        src: /runner/project/api_proxy.conf
        dest: /etc/nginx/conf.d/api_proxy.conf

    - name: Ensure api cache exists
      ansible.builtin.file:
        path:  /var/cache/nginx/apicache
        state: directory

    - name: Start nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
        enabled: yes
